name: "Docker Build and Push"
description: "Build a Docker image and optionally push to GHCR"

inputs:
  image-name:
    description: "Full image name without tag (e.g. proops2026-fly/api-gateway)"
    required: true
  image-tag:
    description: "Image tag — use commit SHA for traceability"
    required: true
  push:
    description: "Push to registry: true on merge, false on PR open"
    required: false
    default: "false"
  registry-username:
    description: "Registry username"
    required: false
  registry-password:
    description: "Registry password or token"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ inputs.push }}
        tags: ghcr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
