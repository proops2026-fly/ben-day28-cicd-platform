name: "Build Node App"
description: "Setup Node, install dependencies, lint, type-check and test"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "20"
  working-directory:
    description: "Directory to run the build in"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run lint

    - name: Type check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run type-check

    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run test:coverage
