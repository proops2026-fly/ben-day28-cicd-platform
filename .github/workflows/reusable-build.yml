name: Reusable Build Workflow
on:
  workflow_call:
    inputs:
      project-name:
        type: string
        required: true
      service-name:
        type: string
        required: true
    outputs:
      image-tag:
        description: "Commit SHA used as the image tag"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Setup Go
        run: |
          go version
          go mod download

      - name: Lint and test
        run: |
          go vet ./...
          go test $(go list ./... | grep -v "tests/integration" | grep -v "internal/handlers") -coverprofile=coverage.out

      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Docker build and push
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ inputs.project-name }}/${{ inputs.service-name }}:${{ steps.set-tag.outputs.tag }} .
          docker push ghcr.io/${{ inputs.project-name }}/${{ inputs.service-name }}:${{ steps.set-tag.outputs.tag }}
