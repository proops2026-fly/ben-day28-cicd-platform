name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      project-name:
        type: string
        required: true
      service-name:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      push-image:
        type: boolean
        default: false
      sonar-enabled:
        type: boolean
        default: true
    secrets:
      REGISTRY_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test
        uses: proops2026-fly/ben-day28-cicd-platform/.github/actions/build-node-app@v1
        with:
          node-version: ${{ inputs.node-version }}

      - name: Docker build and push
        uses: proops2026-fly/ben-day28-cicd-platform/.github/actions/docker-build-push@v1
        with:
          image-name: ${{ inputs.project-name }}/${{ inputs.service-name }}
          image-tag: ${{ inputs.image-tag }}
          push: ${{ inputs.push-image }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: SonarCloud Scan
        if: ${{ inputs.sonar-enabled }}
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
